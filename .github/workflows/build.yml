# Builds the installers. Push a tag like v1.0.1 to publish them on the repo's Releases page.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python test_ezcopy.py
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --onefile --name EzCopy ezcopy.py
      - name: Make installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if ($v -notmatch '^\d') { $v = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$v" installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: EzCopy-Windows, path: installer/EzCopy-Setup.exe }
  mac:
    strategy:
      matrix:
        include:
          - { os: macos-latest, label: AppleSilicon }
          - { os: macos-15-intel, label: Intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python test_ezcopy.py
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --windowed --name EzCopy ezcopy.py
      - name: Make DMG (drag EzCopy to Applications)
        run: |
          mkdir stage && cp -R dist/EzCopy.app stage/ && ln -s /Applications stage/Applications
          hdiutil create -volname EzCopy -srcfolder stage -ov -format UDZO "EzCopy-Mac-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: "EzCopy-Mac-${{ matrix.label }}", path: "EzCopy-Mac-${{ matrix.label }}.dmg" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: out/* }
